<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project | SmartSpace AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="interior-home">

    <!-- NAVBAR -->
    <nav class="interior-menu">
        <a href="/" class="menu-active">SmartSpace AI</a>
        <a href="/">Home</a>
        <span>Local Mode Active</span>
    </nav>


    <!-- CREATE PROJECT -->
    <main class="create-project-page">

        <div class="create-project-container">

            <div class="create-project-label">
                ✦ AI INTERIOR DESIGN STUDIO
            </div>

            <h1>
                Create your <em>dream space.</em>
            </h1>

            <p class="create-project-subtitle">
                Start a new intelligent interior design project.
            </p>


            <form method="POST" action="/create-project">

                <!-- PROJECT NAME -->
                <div class="form-group">
                    <label for="project_name">
                        Project Name
                    </label>

                    <input
                        type="text"
                        id="project_name"
                        name="project_name"
                        value="My Modern Living Room"
                        required
                    >
                </div>


                <!-- ROOM TYPE -->
                <div class="form-group">
                    <label for="room_type">
                        Room Type
                    </label>

                    <select
                        id="room_type"
                        name="room_type"
                        required
                    >
                        <option value="Living Room">Living Room</option>
                        <option value="Bedroom" selected>Bedroom</option>
                        <option value="Master Bedroom">Master Bedroom</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Bathroom">Bathroom</option>
                        <option value="Dining Room">Dining Room</option>
                        <option value="Office">Home Office</option>
                    </select>
                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">
                    <label for="description">
                        Project Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Describe your ideal room..."
                    >Need a spacious and ergonomic layout</textarea>
                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="create-project-button"
                >
                    Create Project & Continue
                    <span>→</span>
                </button>

            </form>

        </div>

    </main>

</body>
</html>
